[default]
locale = "en-gb"

[default.extend-words]
# deliberate (sic) quote of a vendor typo in docs/02-ta-protocol.md
ernoll = "ernoll"
# Goodix protocol command names, the harness flag and the libfprint operation
# are all spelled the American way
enroll = "enroll"

[default.extend-identifiers]
# Official Clang/GCC sanitizer names.
AddressSanitizer = "AddressSanitizer"
UndefinedBehaviorSanitizer = "UndefinedBehaviorSanitizer"
